function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}


function loadQuestions(mode = "random") {

    let questionPool;


    if (mode === "wrong" && wrongQuestions.length > 0) {

        questionPool = [...wrongQuestions];


        // If fewer than 30 wrong questions exist, fill the rest randomly
        if (questionPool.length < 30) {

            const remaining = allQuestions.filter(
                q => !wrongQuestions.includes(q)
            );


            shuffle(remaining);


            questionPool = questionPool.concat(
                remaining.slice(0, 30 - questionPool.length)
            );

        }


    } else {

        questionPool = [...allQuestions];

    }


    shuffle(questionPool);


    currentQuestions = questionPool.slice(0, 30);


    const form = document.getElementById("exam-form");

    form.innerHTML = "";


    document.getElementById("result").innerHTML = "";

    document.getElementById("exam-options").innerHTML = "";


    currentQuestions.forEach((question, index) => {


        const questionDiv = document.createElement("div");

        questionDiv.className = "question";


        questionDiv.innerHTML =

            `<p><strong>${index + 1}. ${question.text}</strong></p>` +

            question.answers.map(answer =>

                `<label>

                    <input type="radio" name="q${index}" value="${answer.letter}">

                    ${answer.letter}. ${answer.text}

                </label>`

            ).join("");


        if (question.image) {

            const img = document.createElement("img");

            img.src = question.image;

            img.alt = "";

            img.className = "question-image";


            questionDiv.appendChild(img);

        }


        form.appendChild(questionDiv);

    });

}



function submitExam() {

    if (document.querySelector(".explanation-box")) {
        return;
    }

    const questions = document.querySelectorAll(".question");


    let score = 0;


    wrongQuestions = [];


    questions.forEach((questionDiv, index) => {


        const question = currentQuestions[index];


        const selectedAnswer = document.querySelector(
            `input[name="q${index}"]:checked`
        );


        questionDiv.querySelectorAll("label").forEach(label => {


            const input = label.querySelector("input");


            if (input.value === question.correctAnswer) {

                label.classList.add("correct");

            }


            if (selectedAnswer && input.value === selectedAnswer.value) {


                if (input.value !== question.correctAnswer) {

                    label.classList.add("incorrect");

                }

            }

        });



        if (selectedAnswer && selectedAnswer.value === question.correctAnswer) {

            score++;

        } else {

            wrongQuestions.push(question);

        }



        const correct = question.answers.find(
            a => a.letter === question.correctAnswer
        );


        const explanation = document.createElement("div");


        explanation.className = "explanation-box";


        explanation.innerHTML =

            `<div class="answer-title">

                ✔ Correct Answer:

                ${correct.letter.toUpperCase()}. ${correct.text}

            </div>

            <div>

                ${question.explanation ?? "Explanation coming soon."}

            </div>

            <div class="reference">

                ${question.reference ?? ""}

            </div>`;



        questionDiv.appendChild(explanation);


    });



    const passingScore = Math.ceil(currentQuestions.length * 0.8);



    document.getElementById("result").innerHTML =


        `You scored <strong>${score}</strong> out of ${currentQuestions.length}<br><br>

        <span style="font-size:22px">

        ${(score >= passingScore)

            ? "✅ PASS"

            : "❌ FAIL"}

        </span>`;



    document.getElementById("exam-options").innerHTML =


        `

        <br>

        <button onclick="loadQuestions('random')">

            🔄 Take Another Random 30 Question Exam

        </button>


        <br><br>


        <button onclick="loadQuestions('wrong')"

        ${wrongQuestions.length === 0 ? "disabled" : ""}>

            ❌ Practice Wrong Answers (${wrongQuestions.length})

        </button>

        `;

}



window.onload = loadQuestions;
